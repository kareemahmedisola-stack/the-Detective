 id:"ledger",
 title:"The Missing Ledger of Lagos Island Market",
 briefA:"Lagos Island, Thursday morning. Baba Tunde Adewale, the oldest trader in the market, has a problem. Last night, someone took his ledger, the book that records every debt owed to him, from the locked drawer in his office. Nothing else was touched. Baba Tunde has asked you, the best listener in Lagos, to find the thief.",
 briefClock:" He will go to the police at six this evening, when the last boat leaves the jetty, and by then the thief could be gone. Every question and every search costs time.",
 briefB:" Listen closely. Every sound is a clue, and everyone is hiding something. Something about this case feels wrong. Someone in this market is watching you. Put on your headphones. When you are ready, continue.",
 lostText:"Kunle owed one hundred and fifty thousand naira, due on Friday. At midnight, while Sani stood at the gate, Kunle let himself into the office with his spare key and took the ledger. He ran to the jetty in his squeaking new sandals, lost a brass buckle on the planks, and crossed the water with Pa Musa. With no one to stop him, he slipped away on the evening boat with the ledger. Baba Tunde never saw it again.",
 locations:{
  market:{name:"Market Square",amb:"crowd",
   desc:"Stalls are opening and a crowd murmurs all around you. A fish seller shouts her prices on your far left. A fabric seller stands just left of centre, and a wealthy trader just right of centre. On your far right hangs the old gate bell. A pure-water seller chatters nonstop just right of the bell.",
   desc2:"An eager errand boy is hopping about in the middle of the square, waving and calling your name.",
   spots:[
    {id:"mamaput",type:"person",ref:"mamaput",icon:"🐟",label:"Mama Put, the fish seller",pan:-.8,hum:220},
    {id:"ngozi",type:"person",ref:"ngozi",icon:"🧵",label:"Madam Ngozi, the fabric seller",pan:-.25,hum:330},
    {id:"chief",type:"person",ref:"chief",icon:"🎩",label:"Chief Bello, a wealthy trader",pan:.3,hum:150},
    {id:"bola",type:"person",act2:true,ref:"bola",icon:"🧒🏾",label:"Bola, an eager errand boy",pan:.08,hum:430},
    {id:"sisi",type:"person",ref:"sisi",icon:"💧",label:"Sisi, a chatty pure-water seller",pan:.62,hum:500},
    {id:"gatebell",type:"object",icon:"🔔",label:"The old gate bell",pan:.9,snd:"bell",
     text:"You pull the bell rope. The bell rings out across the whole market. The rope hangs from the gate post, so only a person standing at the gate can ring it.",clues:["gatebell"]},
    {id:"trunk",type:"object",act2:true,icon:"🧳",label:"Madam Ngozi's trunk",pan:-.5,snd:"rustle",text:"You open the trunk the note pointed to. Lace, thread, and a small tin of coins. Madam Ngozi really is poor. Whoever sent that note wanted you to waste time suspecting her.",clues:["trunk"]}]},
  jetty:{name:"The Jetty",amb:"water",
   desc:"Water laps against old boards and ropes creak. A boatman mends his net on your left. A driver waits by his car, just left of centre. A ticket clerk hums a slow tune at his booth, just right of centre. Something small is clinking against the planks on your right, and a loose paper flaps on the steps far to your right.",
   spots:[
    {id:"musa",type:"person",ref:"musa",icon:"⛵",label:"Pa Musa, the boatman",pan:-.7,hum:190},
    {id:"emeka",type:"person",ref:"emeka",icon:"🚗",label:"Emeka, a driver, beside a big car",pan:-.1,hum:260,sig:"horn"},
    {id:"tobi",type:"person",ref:"tobi",icon:"🎫",label:"Tobi, the ticket clerk, humming a tune",pan:.2,hum:392,sig:"tune"},
    {id:"buckle",type:"object",icon:"✨",label:"Something clinking on the planks",pan:.5,snd:"clink",
     text:"You kneel and find a small brass buckle, bright and new, torn from a strap. A scrap of leather is still attached. It looks like it came from a sandal.",clues:["buckle"]},
    {id:"page",type:"object",icon:"📄",label:"A loose paper on the steps",pan:.95,snd:"page",
     text:"A wet scrap of paper, torn from the corner of a big book. Neat columns of names and amounts. Next to Madam Ngozi: four hundred thousand naira. Next to Kunle: one hundred and fifty thousand naira, due Friday.",clues:["ledgerpage"]}]},
  office:{name:"Baba Tunde's Office",amb:"clock",
   desc:"A wall clock ticks slowly. The room smells of old paper and lamp oil. The watchman stands on your far left, the desk is just ahead, the visitors' book lies by the door on your right, and the apprentice waits on your far right. An umbrella drips by the door.",
   spots:[
    {id:"sani",type:"person",ref:"sani",icon:"🔦",label:"Sani, the night watchman",pan:-.8,hum:140},
    {id:"drawer",type:"object",icon:"🗄️",label:"The desk drawer",pan:-.1,snd:"lock",
     text:"The desk drawer is shut tight. You run your fingers over the lock. No scratches and no dents. The thief opened it with a key. The office door was also locked this morning, with no damage.",clues:["nokey"]},
    {id:"book",type:"object",icon:"📖",label:"The visitors' book",pan:.3,snd:"page",
     text:"The visitors' book. The last entry says: Chief Bello, signed out at six oh five in the evening. Nobody signed in after him.",clues:["chiefAlibi"]},
    {id:"kunle",type:"person",ref:"kunle",icon:"🧑🏾‍💼",label:"Kunle, Baba Tunde's apprentice",pan:.7,hum:300},
    {id:"umbrella",type:"object",icon:"☂️",label:"A dripping umbrella by the door",pan:.95,snd:"rustle",
     text:"A black umbrella leans by the door, dripping onto the boards. Initials on the handle: T.A. Tunde Adewale. It is Baba Tunde's own, and it rained on him last evening. It tells you nothing about the thief, but it was tempting to think otherwise.",clues:["umbrella"]}]},
  shore:{name:"The Far Shore",amb:"water",act2:true,
   desc:"The far shore is quiet. Water laps in the dark reeds and a palm leans over the mud. Kunle stands on your far left, ashamed. A hollow under the fallen palm is just ahead, and something pale lies in the mud on your right.",
   spots:[
    {id:"kunleS",type:"person",ref:"kunleShore",icon:"🧑🏾",label:"Kunle, ashamed",pan:-.8,hum:300},
    {id:"hideout",type:"object",icon:"📚",label:"The hollow under the palm",pan:-.1,snd:"page",text:"Kunle points. You reach into the hollow and pull out a bundle wrapped in cloth: the ledger. Pages are torn, but one is intact. Chief Bello: two million naira, due Friday. Beside it, in Baba Tunde's handwriting: will not extend.",clues:["ledgerFound"]},
    {id:"band",type:"object",icon:"💵",label:"Something pale in the mud",pan:.6,snd:"page",text:"A torn paper band, the kind that wraps new banknotes, stamped Bello Holdings. Beside it in the mud, the wide tracks of a big car.",clues:["bankband"]}]}
 },
 people:{
  mamaput:{name:"Mama Put",role:"Fish seller. Sleeps beside her stall.",v:1,
   intro:"Ah, detective! You want fish or you want gossip? Both are fresh.",
   topics:[
    {q:"What did you hear last night?",a:"I sleep beside my stall, but my ears never sleep. At midnight the gate bell rang, and Sani shouted, Goodnight, Mama Put, like every night. Just after that, I heard somebody hurrying toward the jetty. Squeak, squeak, squeak. The left shoe was squeaking, loud like a rat!",clues:["saniGate","steps"],snd:"steps"},
    {q:"What do you think of Baba Tunde?",a:"A fair man. He counts every kobo, but he forgives when you are sincere. Whoever took that book did not know him well."}]},
  ngozi:{name:"Madam Ngozi",role:"Fabric seller.",v:2,
   intro:"Detective. I sell the finest lace in Lagos. If this is about the ledger, I was not there.",intro2:"Still asking? I told you, I was asleep. Are you saying I am a thief?",
   topics:[
    {q:"Where were you last night?",a:"At home in Surulere, in bed by ten. My neighbour will tell you. I was nowhere near this market.",tell:"rustle"},
    {q:"Is it true you owe Baba Tunde money?",a:"Four hundred thousand naira. Everybody knows it. But I pay slowly and he is patient. Why would I steal a book that already forgives me?",clues:["ngoziDebt"],tell:"rustle"},
    {q:"What do you notice about the others here?",a:"Me, I notice shoes. That boy Kunle bought new sandals last week, with shiny brass buckles. They squeak with every step. You can hear him coming from three stalls away. And he was proud of them, even though Baba Tunde had just lent him money.",clues:["sandals"]}]},
  chief:{name:"Chief Bello",role:"Wealthy trader. Wanted Baba Tunde's stall.",v:3,
   intro:"Chief Bello, at your service. I do not usually stand in markets, but this is a serious matter.",
   topics:[
    {q:"Where were you last night?",a:"I left the market at six o'clock sharp. My driver took me home. I was in bed with my newspaper by seven.",tell:"tap"},
    {q:"You wanted to buy Baba Tunde's stall, didn't you?",a:"I offered him double its worth. He refused. Yes, I was annoyed. But a man does not steal what he can buy.",clues:["chiefOffer"],tell:"tap"},
    {q:"Do you owe Baba Tunde anything?",a:"Nothing. Not one kobo. I do not borrow money, detective.",clues:["chiefDenial"],tell:"tap"}],
   bluff:"That proves nothing, detective. Try again with something better.",
   confront:{
    ledgerFound:{need:["emekaConfession"],a:"Chief Bello is silent for a long time. Then he laughs, a short cold laugh. Two million naira, due Friday. That old fool would not extend it. That book would have ruined me. I only meant it to disappear. Nobody was meant to be hurt.",clues:["chiefConfession"],tell:"tap",fail:"A page from a book I have never seen? Anyone can write a number. Show me something that puts me at that shore."},
    emekaConfession:{need:["ledgerFound"],a:"Chief Bello is silent for a long time. Then he laughs, a short cold laugh. So the driver talks. Two million naira, due Friday. That book would have ruined me. I only meant it to disappear. Nobody was meant to be hurt.",clues:["chiefConfession"],tell:"tap",fail:"My driver says many things. What does that prove without the book?"},
    horn:{fail:"Half of Lagos has a two-note horn, detective."},
    bankband:{fail:"Bello Holdings prints thousands of these bands. Anyone could have dropped it."}}},
  musa:{name:"Pa Musa",role:"Boatman. Works the night crossing.",v:4,
   intro:"Mm. Careful on the boards, detective. They talk.",
   topics:[
    {q:"Did you take anyone across last night?",a:"Twenty minutes past midnight, one passenger. A young man with his cap pulled low. He paid me in crisp new notes and said not one word. He kept clearing his throat. And his shoes! Squeak, squeak on my planks. I told him, step soft, my friend. He hurried away on the far side.",clues:["passenger"],snd:"cough"},
    {q:"Did you see Chief Bello?",a:"The big Chief? Not last night, not this week. Chiefs do not take my boat. They have cars."}]},
  emeka:{name:"Emeka",role:"Chief Bello's driver.",v:5,
   intro:"I only drive, detective. I see nothing and I hear nothing. Mostly.",
   topics:[
    {q:"Where did you take Chief Bello last night?",a:"Home, sir. Six o'clock, straight to his gate. I waited until his light went off, then I went to my own bed. He did not come out again.",clues:["chiefAlibi"]},
    {q:"Whose car is that?",a:"The Chief's car, sir. I drive it. Everybody knows its horn. Two notes, low, then lower, like a cow with a cold.",tell:"horn"},
    {q:"Did you notice anything unusual at the jetty?",a:"Only the boatman complaining. Oh, and something shiny near the posts on the right. I did not touch it. Not my business."}],
   bluff:"I do not know what you mean. I drove the Chief home at six and slept.",
   confront:{
    horn:{a:"Emeka goes quiet. His hands shake. All right. All right! The Chief called me at midnight. I drove him to the far shore, half past twelve. He told me to say I took him home at six, or I would lose my job. I did not know what it was for. I swear it.",clues:["emekaConfession"],debunk:["chiefAlibi"],tell:"gulp"},
    bankband:{a:"Emeka stares at the paper band. Where did you find that? ... Fine. The Chief paid someone on the far shore. I drove him there at half past twelve, and I was told to lie about it. I am sorry.",clues:["emekaConfession"],debunk:["chiefAlibi"],tell:"gulp"}}},
  sani:{name:"Sani",role:"Night watchman for eleven years.",v:6,
   intro:"Good morning. I have guarded this market for eleven years. Nothing like this ever happened.",
   topics:[
    {q:"Where were you last night?",a:"At the gate, all night, as always. I rang the bell at midnight and greeted Mama Put. I never left my post. Ask her."},
    {q:"Who has keys to the office?",a:"Three keys only. Baba Tunde's own. My master key, which never leaves my belt. And a spare for Kunle, the apprentice, so he can open in the morning.",clues:["keyholders"],tell:"keys"},
    {q:"What about Kunle?",a:"A good boy, quiet. Lately he has seemed worried about money, that is all."}]},
  kunle:{name:"Kunle",role:"Baba Tunde's apprentice.",v:7,
   intro:"Oga detective. I... I am Kunle. Baba Tunde's apprentice. This whole thing is terrible.",intro2:"Detective... you again. I have told you everything. Why do you keep looking at me like that?",
   topics:[
    {q:"Where were you last night?",a:"At home, in bed. I had a bad cough, so I did not go out. My landlady was away, so nobody can say. But I swear.",tell:"gulp"},
    {q:"Did you owe Baba Tunde money?",a:"A little. An advance of one hundred and fifty thousand naira, due on Friday. But he was kind about it. It is not a reason to do anything bad.",clues:["kunleDebt"],tell:"gulp"},
    {q:"Those are new sandals, aren't they?",a:"Eh... yes. I bought them last week. Why? ... Why does everyone look at my shoes?",clues:["sandals"],snd:"steps"}]}
  ,kunleShore:{name:"Kunle",role:"Confessed apprentice.",v:7,
   intro:"I will tell you everything now. Please. I only want to make it right.",
   topics:[
    {q:"Who paid you?",a:"I never saw his face. A deep voice in the dark, here on this shore. He gave me new notes and said, Tunde's book must disappear. When he drove away, his car sounded a horn. Two notes. Low, then lower.",clues:["horn"],snd:"horn"},
    {q:"Why did you do it?",a:"He promised my debt would vanish. I was so afraid. Baba Tunde was always kind to me, and I repaid him like this."}]}
  ,tobi:{name:"Tobi",role:"Ticket clerk at the jetty. Hums when he is nervous.",v:6,
   intro:"Oh! Detective. Forgive me, I was humming again. It is a habit. Especially today.",
   topics:[
    {q:"That tune you are humming. What is it?",a:"An old highlife my mother used to sing while she sold tickets here. I hum when I am nervous. And I have been very nervous since you walked past my booth this morning, detective.",tell:"tune",love:1},
    {q:"Did you see anything last night?",a:"I lock the booth at midnight, but I keep the passenger book. One young man, twenty past twelve, paid in new notes. He would not look at me. I wrote the time down, because someone told me you like facts.",clues:["passenger"]},
    {q:"Would you walk by the water with me when this is over?",a:"I would like that more than I can say. Catch your thief, detective. I will be at the end of the jetty, humming loudly so you can find me.",tell:"tune",love:1}]}
  ,bola:{name:"Bola",role:"Errand boy. Very eager to help.",v:2,
   intro:"Detective! Detective! Over here! I have important news. Very important.",
   topics:[
    {q:"What do you want to tell me?",a:"I run errands all night around this market, so I see everything. Last night at midnight I looked at the gate and it was empty. No Sani, no lamp, nothing. Sani had slipped away to the jetty. It is him, detective, I swear on my mother!",clues:["bolaClaim"],tell:"gulp"},
    {q:"Why come to me now?",a:"Because an honest boy must speak up. And because, well, a good citizen should be rewarded, no? Never mind that part. Sani did it.",tell:"gulp"}],
   bluff:"I told you what I saw. Why do you not believe me? Show me who says different.",
   confront:{
    saniGate:{a:"Bola's grin slides off his face. All right, all right! A man's driver stopped me at the gate yesterday evening and pushed crisp new notes into my hand. He said, tell the detective Sani left his post. I did not know it would hurt Sani. Please, do not tell Sani.",clues:["bolaConfession"],debunk:["bolaClaim"],debunkMsg:"Bola's claim about Sani is now proved false.",tell:"gulp"},
    gatebell:{fail:"The bell? A bell rope hangs there all day, detective. Anyone could have pulled it earlier. Who says it rang at midnight?"}}}
 },
 clues:{
  nokey:["No forced entry","The drawer lock is undamaged. The thief used a key."],
  keyholders:["Three keys","Only three keys exist: Baba Tunde's, Sani's master key, and Kunle's spare."],
  gatebell:["The gate bell","The bell can only be rung from the gate post."],
  saniGate:["Sani at the gate","Mama Put heard Sani ring the bell and greet her at midnight. He was at the gate."],
  steps:["Squeaky footsteps","Just after midnight, Mama Put heard someone with a squeaky left shoe hurry toward the jetty."],

const SYN=window.speechSynthesis||null;let voices=[],pool=[];
function scoreV(v){let s=0;if(/natural|neural|online/i.test(v.name))s+=4;if(/en-NG/i.test(v.lang))s+=3;else if(/en-(GB|ZA|KE|GH|IE|AU)/i.test(v.lang))s+=1;if(/google|siri|samantha|daniel|karen|moira|serena|aria|jenny|guy|sonia|ryan|libby|abeo|ezinne/i.test(v.name))s+=1;if(/espeak|compact|robot|zira desktop|david desktop/i.test(v.name))s-=3;return s}
function loadV(){voices=SYN?SYN.getVoices().filter(v=>/^en/i.test(v.lang)):[];pool=[...voices].sort((a,b)=>scoreV(b)-scoreV(a));fillVoiceSel()}
if(SYN){loadV();SYN.onvoiceschanged=loadV}
function fillVoiceSel(){const el=$("#vsel");if(!el)return;el.innerHTML='<option value="">Automatic (most natural first)</option>'+voices.map(v=>`<option value="${v.name.replace(/"/g,"")}">${v.name.replace(/</g,"")}</option>`).join("");el.value=S.voice||""}
function voiceFor(v){if(!pool.length)return null;const narr=(S.voice&&voices.find(x=>x.name===S.voice))||pool[0];if(v===0)return narr;const o=pool.filter(x=>x!==narr),arr=o.length?o:pool;return arr[(v-1)%arr.length]}
const PROF={0:{p:.95,r:.95},1:{p:1.1,r:1.02},2:{p:1.2,r:.98},3:{p:.8,r:.9},4:{p:.85,r:.88},5:{p:1,r:1.05},6:{p:.9,r:.95},7:{p:1.15,r:1.08}};
function sayq(segs){
 try{Access.note(segs.map(s=>s.t).join(" "))}catch(x){}
 const txt=segs.map(s=>s.t).join(" ");if(G)G.last=segs;
 $("#cap").textContent=txt;
 const live=$("#live");live.setAttribute("aria-live",S.mode==="sr"?"polite":"off");
 if(S.mode==="sr"||!SYN){live.textContent="";setTimeout(()=>live.textContent=txt,40);const e=estMs(txt);mouth(e);return e}
 SYN.cancel();let est=0;
 segs.forEach(s=>{const pr=PROF[s.v||0],vo=voiceFor(s.v||0);(s.t.match(/[^.!?]+[.!?]*/g)||[s.t]).forEach(part=>{
  const u=new SpeechSynthesisUtterance(part.trim());if(!u.text)return;
  u.pitch=pr.p;u.rate=pr.r*S.rate;u.volume=1;if(vo)u.voice=vo;
  est+=part.length*70/(pr.r*S.rate);SYN.speak(u)})});
 duck(est+500);mouth(est);return est;
}

function spend(m,segs){
 if(S.pressure!=="on")return;
 if(G.heat>=4&&m>=10){m+=5;if(!G.stallNote){G.stallNote=1;segs.push({t:"Doors are closing. People stall and mumble because the Chief's network is watching you. It costs five extra minutes.",v:0})}}

 if(k==="Escape"&&backFn){e.preventDefault();backFn();return}
 if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;
 if(cur==="loc"){
  if(k==="ArrowRight"||k==="."||k==="]"||k==="PageDown"){e.preventDefault();move(1);return}
  if(k==="ArrowLeft"||k===","||k==="["||k==="PageUp"){e.preventDefault();move(-1);return}
  if(k==="Enter"||k===" "){
   if(tag==="BUTTON"&&!t.classList.contains("spot"))return;
   const i=G.sel>=0?G.sel:(t.classList&&t.classList.contains("spot")?+t.dataset.i:-1);
   if(i>=0){e.preventDefault();investigate(i)}return}
 }
 if(k==="Enter"&&(cur==="title"||cur==="brief"||cur==="twist"||cur==="ride"||cur==="checkpoint")&&tag!=="BUTTON"){const b=main.querySelector(".primary");if(b){e.preventDefault();b.click()}return}
 if(!G||cur==="title")return;
 if(/^[1-9]$/.test(k)){const o=main.querySelectorAll(".opt")[+k-1];if(o){e.preventDefault();o.click()}return}
 const lk=k.toLowerCase();
 if(cur==="talk"&&(lk==="p"||(k===" "&&G.tw))){e.preventDefault();pressTell();return}
 if(lk==="b"){e.preventDefault();radio(e.shiftKey);return}
 if(lk==="t"){e.preventDefault();Sfx.setAssist(!Sfx.assist());say("Assisted mode "+(Sfx.assist()?"on. Tell windows last six seconds.":"off. Tell windows last three seconds."));return}
 if(lk==="r"){if(G.last)sayq(G.last);return}
 if(cur==="brief"||cur==="twist")return;
 if(lk==="n"&&cur!=="note"&&cur!=="end"){e.preventDefault();openNote()}
 else if(lk==="h"&&cur!=="end"&&!G.forced){e.preventDefault();giveHint()}
 else if(lk==="a"&&cur!=="accuse"&&cur!=="end"){e.preventDefault();go("accuse",{step:1})}
});

main.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
main.addEventListener("touchend",e=>{if(tx===null||cur!=="loc")return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)move(dx<0?1:-1)},{passive:true});
addEventListener("pointerdown",()=>initAudio(),{once:true});

function mouth(ms){const p=document.querySelector("#port .pp");if(!p)return;p.classList.add("talk");clearTimeout(mouth.t);mouth.t=setTimeout(()=>p.classList.remove("talk"),Math.min(ms,20000))}
const cp=id=>People.cast[id==="musa"?"baba":id]||{};
function epiText(L){return L<1?"At sunset, as the last boat leaves, a slow highlife tune drifts along the jetty. You never stopped to ask who was humming. Maybe next time you will.":L<3?"At sunset the clerk from the jetty is waiting with two paper cups of ginger tea and a ticket for a boat that goes nowhere in particular. Walk with me? says Tobi. You, the best listener in Lagos, find you have nothing to say, and that it is the best conversation of the week.":"At sunset the jetty lanterns come on. Tobi hums his mother's highlife, offers his hand, and asks, May I? You have spent all week listening for lies. Now you listen to one steady heartbeat, and you dance on the old boards while the water keeps time. For once, there is nothing to solve."}
function epiHtml(){const L=G.love||0;if(L<1)return `<div class="paper"><h3>Epilogue</h3><p>${epiText(0)}</p></div>`;
return `<div class="paper epi" id="epi"><h3>Epilogue</h3><div class="cpl">${People.html(Object.assign({},People.cast.you,{cls:L>=3?"dance":"blush"}))}${People.html(Object.assign({},People.cast.tobi,{cls:L>=3?"dance rev":"wave"}))}</div><p>${epiText(L)}</p></div>`}

/* ===================== ACCESSIBILITY + ATMOSPHERE (shared layers) ===================== */
(function(){
 const dangerNow=()=>{if(!G||cur==="title"||cur==="end")return 0;const left=Math.max(0,Math.min(1,(G.deadline-G.time)/(G.act===2?180:540)));return Math.min(1,(G.heat||0)/5*.65+(S.pressure==="on"?(1-left)*.35:0))};
 const _go=go;go=function(v,a){try{Atmos.cut(240)}catch(x){}const r=_go(v,a);try{Atmos.danger(dangerNow())}catch(x){}return r};
 const _hud=hud;hud=function(){_hud();try{Atmos.danger(dangerNow())}catch(x){}};
 const _judge=judge;judge=function(w){try{Atmos.letterbox(true,5200);Atmos.flash("#ffd28a",.25)}catch(x){}return _judge(w)};
 const _gain=gain;gain=function(list){const r=_gain(list);try{G.srcOf=G.srcOf||{};const who=(cur==="talk"&&CASE.people[ctx.pid])?CASE.people[ctx.pid].name:(cur==="loc"&&CASE.locations[ctx.id]?CASE.locations[ctx.id].name:"the case");r.ids.forEach(id=>{G.srcOf[id]=G.srcOf[id]||who})}catch(x){}return r};
 const pal=p=>p<-.7?"far left":p<-.25?"left":p<.25?"centre":p<.7?"right":"far right";
 const head=()=>{const h=$("#vh");return h?h.textContent:""};
 const clue=id=>CASE.clues[id]||(CASE.act2&&CASE.act2.clues&&CASE.act2.clues[id])||[id,""];
 Access.register({
  name:"echo",
  speak:t=>sayq([{t,v:0}]),
  busy:()=>!G||cur==="title"||cur==="ride"||cur==="end"||cur==="brief",
  compass(){
   if(!G)return null;
   if(cur==="loc"&&ctx.spots){const items=ctx.spots.map(s=>({pan:s.pan||0,label:s.label||s.id}));return{items,say:"You are at "+nm(G.at)+". From left to right: "+items.slice().sort((a,b)=>a.pan-b.pan).map(i=>pal(i.pan)+", "+i.label).join(". ")+"."}}
   if(cur==="hub"||cur==="travel"){const pos={office:-.85,market:-.2,jetty:.4,shore:.9},items=visLocs().map(k=>({pan:pos[k]||0,label:nm(k)+(k===G.at?" (you are here)":"")}));return{items,say:"The map, from left to right: "+items.slice().sort((a,b)=>a.pan-b.pan).map(i=>i.label).join(". ")+"."}}
   if(cur==="talk"&&CASE.people[ctx.pid]){return{items:[{pan:0,label:CASE.people[ctx.pid].name}],say:CASE.people[ctx.pid].name+" is standing in front of you, in the centre."}}
   return null},
  summary(){
   if(!G)return head()||"Echo Detective.";
   if(cur==="loc"){const L=CASE.locations[ctx.id];if(L)return L.name+". "+dsc(L)+" "+(ctx.spots?ctx.spots.length+" things to investigate.":"")}
   if(cur==="talk"){const P=CASE.people[ctx.pid];if(P)return "Talking with "+P.name+", "+P.role+". "+(S.pressure==="on"?clockStr()+".":"")}
   if(cur==="hub"||cur==="travel")return "Case board. You are at "+nm(G.at)+". "+(S.pressure==="on"?clockStr()+". ":"")+G.order.length+" clues. Heat "+G.heat+" of 5. Nerve "+G.nerve+". Radio "+(G.radio?"on":"off")+".";
   return head()||"Echo Detective."},
  goal(){
   if(!G||cur==="title")return "Press the Begin button to start the case.";
   const t=S.pressure==="on"?" It is "+clockStr()+".":"";
   return (G.act===2?"Goal: expose the mastermind behind the theft. You need solid proof, not just suspicion. Beware of tips that fit only part of the story, and remember that a nervous person is not always a guilty one."
     :"Goal: find out who took the ledger, and be ready to accuse with at least two solid proofs. Test what people tell you against what you find, and remember that a nervous person is not always a guilty one.")+t+" You have "+G.order.length+" clues. Heat is "+G.heat+" of 5. Press H for a hint."},
  evidence(){
   if(!G)return null;
   const rows=G.order.map(id=>{const c=clue(id),bad=G.debunk&&G.debunk[id];return{h:c[0],t:c[1]+(bad?" This claim has been proved false.":""),tag:bad?"proved false":(G.srcOf&&G.srcOf[id]?"from "+G.srcOf[id]:"")}});
   if(!rows.length)rows.push({h:"Nothing yet",t:"Question people and search places. Every clue you find will appear here."});
   return{title:"Evidence board: "+G.order.length+" clue"+(G.order.length===1?"":"s"),rows,say:G.order.length?"Evidence board. "+G.order.length+" clues. "+G.order.map(id=>clue(id)[0]).join(". ")+". Use Tab to read them one by one. A claim can be proved false by a better clue. Press Escape to close.":"Evidence board. You have no clues yet. Question people and search places."}},
  recap(){if(cur==="talk"&&CASE.people[ctx.pid]){const n=Object.keys(G.asked||{}).filter(k=>String(k).indexOf(ctx.pid)===0).length;return "You are talking with "+CASE.people[ctx.pid].name+" and have asked "+n+" question"+(n===1?"":"s")+"."}return ""}
 });
})();

go("title");
