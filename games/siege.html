function say2(segs,locked){return new Promise(res=>{
  LAST=segs;try{Access.note(segs.map(s=>s.t).join(" "))}catch(x){}const txt=segs.map(s=>s.t).join(" ");$("#cap").textContent=txt;let done=false,tm;
  const fin=()=>{if(done)return;done=true;clearTimeout(tm);skipFn=null;res()};
  if(!locked)skipFn=()=>{if(SYN)SYN.cancel();fin()};else skipFn=null;
  const live=$("#live");live.setAttribute("aria-live",ST.mode==="sr"?"polite":"off");
  if(ST.mode==="sr"||!SYN){live.textContent="";setTimeout(()=>live.textContent=txt,40);tm=setTimeout(fin,estMs(txt)+400);return}
  SYN.cancel();let est=0,last=null;
  segs.forEach(s=>{const pr=PROF[s.v||0],vo=voiceFor(s.v||0);(s.t.match(/[^.!?]+[.!?]*/g)||[s.t]).forEach(part=>{const u=new SpeechSynthesisUtterance(part.trim());if(!u.text)return;u.pitch=pr.p;u.rate=pr.r*ST.rate;u.volume=1;if(vo)u.voice=vo;est+=part.length*68/(pr.r*ST.rate);SYN.speak(u);last=u})});
  if(last)last.onend=fin;tm=setTimeout(fin,est+3500)})}

/* ===================== ORDERS ===================== */
function openBreach(){return SECT.filter(s=>S.breach[s])}

   ["End the day: nightfall",0,()=>endDay()]];
}

function choose(prompt,opts,cb,back){go("choose",{prompt,opts,cb});backFn=back||(()=>go("orders",{msg:"Cancelled."}))}

    {t:"Rally the troops. Morale rises, a little food is eaten (1 order)",v:"ra"},

/* ===================== NIGHTFALL: listen from the wall ===================== */
function endDay(){const d=SG.dusk(S);S.fedNote=d.changed;go("night")}
function heardWord(h){const l=h.lvl,w=l>.8?"thunderous, a great host on the move":l>.55?"steady, with many torches":l>.35?"a few drums and scattered fires":"only whispers";
  return w+". "+(h.type?cap1(TYP[h.type].hear):l<.3?"You cannot make out the weapon":"You cannot tell what weapon it is")}
function hearSound(type,p,lvl){
  switch(type){case "ram":AU.ram(p);setTimeout(()=>AU.ram(p),650);setTimeout(()=>AU.ram(p),1300);break;case "tower":AU.creak(p);break;case "sappers":AU.scrape(p);break;case "boats":AU.oars(p);break;case "ladders":AU.clatter(p);break;default:AU.wind(1500)}
  AU.march(p,1800,.03+lvl*.12,520-lvl*140);AU.drum(p,60+lvl*30,.1+lvl*.35);
}
async function listenNight(my){try{Tense.listen()}catch(e){}

V.night=()=>{

/* ===================== THE ASSAULT ===================== */
const CONTACT={ladders:"Ladders slam against the stone.",ram:"The ram batters the gate.",tower:"The siege tower grinds against the wall.",sappers:"The ground trembles as sappers burrow under the wall.",boats:"Boats grind onto the bank below the gate."};
function contactSound(t,p,k){switch(t){case "ram":AU.ram(p);setTimeout(()=>AU.ram(p),600);break;case "tower":AU.creak(p);setTimeout(()=>AU.crash(p),900);break;case "sappers":AU.scrape(p);setTimeout(()=>AU.rumble(p),900);break;case "boats":AU.oars(p);break;default:AU.clatter(p)}}
function answerText(s,x){const i=x.info,t=x.type;
  if(i.sally==="fail")return "The sally is cut off in the dark and loses men.";
  if(i.answer==="oil")return t==="ram"?"Boiling oil pours onto the ram. It burns and collapses.":"Boiling oil pours down on the ladders. The attackers scream and fall back.";
  if(i.answer==="fire")return t==="tower"?"Fire arrows streak into the siege tower. It burns like a torch.":"Fire arrows set the boats ablaze on the river.";
  if(i.answer==="sally")return "A sally slips out, smashes the engine and returns before the enemy can answer.";
  if(i.answer==="mine")return "Your counter-miners meet the tunnel in the dark. The sappers are caught underground.";
  if(i.answer==="boom")return "The river boom stops the boats short of the bank.";
  if(t==="ram")return "The ram hammers the gate unchecked.";
  if(t==="tower")return "The siege tower reaches the wall with no one to burn it.";
  if(t==="sappers")return "The wall shudders and slumps: the sappers have undermined it.";
  if(t==="boats")return "Boats land soldiers under the gate.";
  return ""}
function outText(s,x){
  const n=cap1(nm(s)),loss=x.defLoss,o=x.out;
  if(x.fb)return `${n}: you fall back behind the inner wall. The outer wall is given up, but the line is saved. ${loss} fell.`;
  if(o==="held")return `${n}: the attackers break against the wall. The line holds with hardly a scratch. ${loss} fell.`;
  if(o==="costly")return `${n}: a brutal fight on the parapet. The line holds, but the wall is scarred. ${loss} fell.`;
  if(o==="barely")return `${n}: the line bends, and bends again, and only just holds. ${loss} fell.`;
  return `${n}: the wall is breached! Attackers pour through the gap. ${loss} fell.`}
async function runAssault(){
  const my=++SEQ;try{Atmos.letterbox(true,90000);Tense.riser(2600)}catch(x){}cur="assault";backFn=null;ctx={};
  main.innerHTML=`<h2 id="vh" tabindex="-1">The assault</h2><p>Listen.</p>`;$("#vh").focus();main.setAttribute("role","application");
  const st=SG.assault(S);setSky(true);paintScene();
  if(st.truce){
    AU.stopDrone();AU.drone(.3);AU.wind(5000);
    await say2([{t:"The truce holds. No drums, no ladders. Across the plain you hear hammers, and the creak of timber. The enemy is not resting. It is building.",v:0}]);if(my!==SEQ)return;
    const res=SG.finish(S,st,null);return afterNightUI(res,st)}
  AU.horn(0,98,2.2,.16);fxFlash("#ff9a3c",.25);await wait(900);if(my!==SEQ)return;
  SECT.forEach(s=>{fxCharge(s);AU.drum(PAN[s],70,.5);setTimeout(()=>AU.drum(PAN[s],70,.4),300)});
  await say2([{t:"The enemy horns sound. The drums quicken. Torches pour across the plain toward all three sectors at once!"+(S.cmd.length?" Your orders go out along the wall.":""),v:0}]);if(my!==SEQ)return;
  const maxA=Math.max(...SECT.map(s=>st.sec[s].A));
  for(const s of SECT){const x=st.sec[s],k=x.A/maxA;fxArrows(s,6+Math.round(k*10));AU.arrows(PAN[s],4+Math.round(k*8),.07+k*.08);contactSound(x.type,PAN[s]);AU.swords(PAN[s],1400,3+k*8,.06+k*.12);fxSparks(s,6+Math.round(k*12));
    if(x.info.answer==="oil"||x.info.answer==="fire")fxPulse(s);
    await say2([{t:cap1(DIR[s])+": "+CONTACT[x.type]+" "+answerText(s,x),v:0}]);if(my!==SEQ)return;
    if(x.info.destroyed||x.info.answer==="mine"||x.info.answer==="boom"){AU.ok();await wait(300)}}
  fxShake();
  let choice=null;
  if(st.pending.length){
    AU.heart(130,12000,.5);AU.horn(0,120,1,.1);
    choice=await decide(st,my);if(my!==SEQ)return;
    main.innerHTML=`<h2 id="vh" tabindex="-1">The assault</h2><p>Listen.</p>`;$("#vh").focus();
  }
  AU.stopHeart();
  const res=SG.finish(S,st,choice);
  for(const s of SECT){const x=res.sec[s];
    if(x.out==="held"){AU.cheer(PAN[s]);fxArrows(s,10,true)}else if(x.out==="costly"){AU.swords(PAN[s],1400,9,.12);AU.groan(PAN[s]);fxSparks(s,16)}else if(x.out==="barely"){AU.groan(PAN[s]);AU.clash(PAN[s],.2);fxSparks(s,22);fxShake()}else{AU.crash(PAN[s]);AU.alarm();fxShake();fxFlash("#ff3b2a",.4);fxSparks(s,30)}
    paintScene();await say2([{t:outText(s,x)+(x.reserve?" The reserve fought here.":""),v:0}]);if(my!==SEQ)return}
  if(res.fell){AU.lose();await say2([{t:res.overrun?`The line at ${nm(res.fell)} is overrun and cannot be rallied. Ilesanmi is falling.`:`A second gap opens in the walls. The breach at ${nm(res.fell)} cannot be closed. Ilesanmi is falling.`,v:0}]);if(my!==SEQ)return}
  else if(res.breached.length){await say2([{t:`The enemy holds a foothold at ${nm(res.breached[0])}. At dawn you must seal the breach, or the next blow may end the siege. A second open breach loses the citadel.`,v:4}]);if(my!==SEQ)return}
  afterNightUI(res,st);
}
function decide(st,my){return new Promise(res=>{
  const wait_=(Sfx.assist&&Sfx.assist()?12000:7000)*Access.timeScale(),pend=st.pending.slice(),hasRes=S.troops.res>0,opts=[];
  if(hasRes)pend.forEach(s=>opts.push({k:"reserve",s,t:`Send the reserve of ${S.troops.res} to ${nm(s)} (${DIR[s]})`}));
  pend.forEach(s=>opts.push({k:"fall",s,t:`Fall back behind the inner wall at ${nm(s)} (${DIR[s]}). You lose the outer wall but save the line`}));
  main.innerHTML=`<h2 id="vh" tabindex="-1">The line is breaking!</h2>
  <p>${pend.map(s=>cap1(nm(s))).join(" and ")} ${pend.length>1?"are":"is"} close to giving way. Decide now.</p>
  <div class="timer"><i style="animation-duration:${wait_}ms"></i></div>
  ${opts.map((o,i)=>`<button class="btn primary" data-k="${i+1}">${i+1}. ${o.t}</button>`).join("")}<button class="btn ghost" data-k="0">0. Hold. Spend nothing</button>`;
  $("#vh").focus();let done=false,ticks=[];
  const fin=v=>{if(done)return;done=true;ticks.forEach(clearTimeout);AU.stopHeart();if(SYN)SYN.cancel();cur="assault";res(v?{k:v.k,s:v.s}:null)};
  cur="decide";backFn=null;ctx={fin:v=>fin(v),opts};
  $$("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;fin(k===0?null:opts[k-1])});
  sayq([{t:`The line is breaking at ${pend.map(nm).join(" and ")}! `+opts.map((o,i)=>`Press ${i+1}: ${o.t}.`).join(" ")+" Press 0 to hold."+Access.coopSay(),v:5}]);
  const n=Math.floor(wait_/1000);for(let i=1;i<=n;i++)ticks.push(setTimeout(()=>AU.tick(i>n-3),i*1000));
  ticks.push(setTimeout(()=>{if(!done){sayq([{t:"Too late. The moment passes, and the line must fend for itself.",v:5}])}fin(null)},wait_))})}
function afterNightUI(res,st){try{Atmos.letterbox(false)}catch(x){}hud();go("aftermath",{res,st})}
V.aftermath=({res,st})=>{
  const my=SEQ;setSky(false);enemyGlow(null);showTypes(null);paintScene();
  const rv=res.reveal||[],heard=S.heard||{};
  const learn=res.truce?[]:SECT.map(s=>{const ht=heard[s]&&heard[s].type,rt=res.plan.type[s];return ht&&ht!==rt?`At ${nm(s)} you heard ${TYP[ht].name}, but it was ${TYP[rt].name}.`:null}).filter(Boolean);
  const baitLine=res.bait?(res.bait.real?`The enemy struck exactly where you whispered to ${SN[res.bait.src]}, and your men were waiting. He is almost certainly the spy.`:res.bait.hit?`The main blow fell where you whispered to ${SN[res.bait.src]}. That may be the spy at work, or luck.`:`The main blow fell elsewhere. ${SN[res.bait.src]} did not pass your bait on.`):"";
  main.innerHTML=`<h2 id="vh" tabindex="-1">${res.truce?"A night of truce":"Dawn after the assault"}</h2>
  ${res.truce?"<p>No assault came tonight. But the enemy used the time.</p>":`<div class="card">${SECT.map(s=>{const x=res.sec[s];return `<b>${cap1(nm(s))}</b> ${x.fb?"fell back":OUT[x.out]}. ${x.defLoss} of yours fell, wall now ${Math.round(x.wall)} of 10. That was ${x.role==="main"?"the main attack":x.role==="feint"?"the feint":"a probe"}, with ${TYP[x.type].name}.${x.info.answer?" "+answerText(s,{info:x.info,type:x.type}):""}`}).join("<br>")}</div>`}
  ${learn.length?`<div class="card"><b>What the dark hid.</b> ${learn.join(" ")}</div>`:""}
  ${rv.length?`<div class="card"><b>Who was right?</b> The main assault fell on ${nm(res.plan.main)}.<br>${rv.map(r=>`${WHO[r.src].n.split(",")[0]} said ${nm(r.claim)}: <b>${r.ok?"right":"wrong"}</b>.`).join("<br>")}</div>`:""}
  ${baitLine?`<div class="card"><b>The bait.</b> ${baitLine}</div>`:""}
  <div class="card"><b>Renown earned tonight:</b> ${res.score||0}. Total ${S.score}. ${SG.assessment(S).length&&!S.src[S.mole].exposed?assessWords():""}</div>
  ${(res.upkeep||[]).map(u=>`<div class="card">${u}</div>`).join("")}
  <button class="btn primary" id="go">${S.over?"Continue":"Continue to the next day (Enter)"}</button>`;
  $("#go").onclick=()=>{SEQ++;if(SYN)SYN.cancel();S.over?go("end"):go("dawn")};
  (async()=>{
    const segs=[];
    if(res.truce)segs.push({t:"A night of truce. No assault came, but the enemy used the time to build.",v:0});
    else{segs.push({t:`The night is over. You lost ${res.defLoss} soldiers. The enemy lost ${res.enemyLoss>70?"heavily":res.enemyLoss>35?"many":"some"}.`,v:0});
      segs.push({t:`Wall strength now: West ${Math.round(S.wall.W)}, North ${Math.round(S.wall.N)}, River ${Math.round(S.wall.R)}.`,v:0})}
    if(learn.length)segs.push({t:learn.join(" "),v:0});
    if(rv.length)segs.push({t:`The main assault fell on ${nm(res.plan.main)}. `+rv.map(r=>`${WHO[r.src].n.split(",")[0]} said ${nm(r.claim)}: ${r.ok?"right":"wrong"}.`).join(" "),v:0});
    if(baitLine)segs.push({t:baitLine,v:0});
    if(res.counters&&res.counters.length&&!res.truce)segs.push({t:`Your answers worked ${res.counters.length} time${res.counters.length>1?"s":""} tonight.`,v:0});
    segs.push({t:`Renown earned: ${res.score||0}.`,v:0});
    (res.upkeep||[]).forEach(u=>segs.push({t:u,v:4}));
    await say2(segs);if(my!==SEQ)return;
    await say2([{t:S.over?"Press Enter to continue.":"Press Enter to see the next dawn.",v:0}],true)})();
};

/* ===================== THE END ===================== */
V.end=()=>{
  const e=SG.ending(S),st=S.stats;let best="",bs=0;
  try{const old=localStorage.getItem("sg_best"),ob=+(localStorage.getItem("sg_bestscore")||0);if(!old||rank.indexOf(e.rank)>rank.indexOf(old))localStorage.setItem("sg_best",e.rank);if(e.score>ob)localStorage.setItem("sg_bestscore",String(e.score));best=localStorage.getItem("sg_best");bs=+localStorage.getItem("sg_bestscore")}catch(x){}
  const lines=[];
  if(e.exposed)lines.push(`You unmasked ${SN[e.mole]} as the enemy's spy. Counter-intelligence protects your decisions as much as your walls.`);
  else lines.push(`The spy was ${SN[e.mole]}, and you never unmasked him.`+(st.wrongArrest?" You arrested an innocent man along the way.":""));
  if(st.counters>=3)lines.push("You answered the enemy's weapons with the right counters. That is the whole art of siege defence: match the answer to the threat.");
  if((st.scouts||0)>=2)lines.push("You verified intelligence before trusting it. Never commit your army to a single source.");
  if(st.baitHits)lines.push("Your bait drew the enemy onto your prepared defences. Deception turned against the deceiver.");
  if((st.commits||0)>=1)lines.push("You held a reserve and threw it in at the decisive moment.");
  if((st.raids||0)>=1)lines.push("You struck at the enemy's supplies and weapons, not only his soldiers.");
  if(st.perfect>=2)lines.push(`${word(st.perfect)} nights without a scratch on any sector.`);
  if(!e.win&&st.counters<2)lines.push("Next time, listen for the weapon and answer it: oil for rams and ladders, fire arrows for towers and boats, a counter-mine for sappers.");
  const msg={relief:"Horns! From the south road, the relief army rides into view, banners high. The enemy lines dissolve before it. Ilesanmi stands.",withdraw:"The drums fall silent. Across the plain the enemy camp is striking its tents. The Northern Confederacy is withdrawing, broken, before the relief army has even arrived. Ilesanmi stands.",sortie:"Your whole garrison pours out at the shaken enemy, and the Confederacy breaks and runs. You won the war with your own spears. Ilesanmi stands.",fall:"The wall is gone, and the enemy pours into Ilesanmi. The citadel has fallen.",starve:"The granaries are empty and the soldiers can no longer lift their spears. The council opens the gates. Ilesanmi surrenders.",mutiny:"The garrison will not fight on. Soldiers lay down their spears and open the gates. Ilesanmi is lost."}[e.kind];
  AU.stopDrone();AU.stopHeart();e.win?AU.win():AU.lose();setSky(!e.win);showTypes(null);
  main.innerHTML=`<h2 id="vh" tabindex="-1">${e.win?"Ilesanmi stands":"Ilesanmi has fallen"}</h2>
  <p>${msg}</p><div class="card"><b>Rank: ${e.rank}.</b> Renown ${e.score}.<br>Soldiers left: ${e.troops}. Sectors held: ${e.held}. Breaches: ${e.breached}. Days: ${Math.min(e.day,S.R)}. ${S.hints?"Hints used: "+S.hints+". ":""}${best?"Your best rank: "+best+", best renown "+bs+".":""}</div>
  <div class="card"><b>What you practised.</b><br>${lines.join("<br>")}</div>
  <button class="btn primary" id="again">Defend Ilesanmi again (P)</button><button class="btn ghost" id="menu">Back to the main menu (Alt+M)</button>`;
  $("#again").onclick=()=>{newRun();go("brief")};$("#menu").onclick=()=>{try{parent.postMessage({dt:"menu"},"*")}catch(x){}};
  try{parent.postMessage({dt:"done",game:"siege",result:e.rank},"*")}catch(x){}
  sayq([{t:(e.win?"Ilesanmi stands. ":"Ilesanmi has fallen. ")+msg+` Your rank: ${e.rank}, with ${e.score} renown. You have ${e.troops} soldiers left. `+lines.join(" ")+" Press P to defend Ilesanmi again, or Alt and M for the main menu.",v:0}]);
};

/* ===================== STATUS, INTEL, HINT, KEYS ===================== */
function statusText(){return `Day ${S.day}. ${S.ap} of ${S.apMax} orders left. Soldiers: West ${S.troops.W}, North ${S.troops.N}, River ${S.troops.R}, reserve ${S.troops.res}. Walls out of ten: West ${Math.round(S.wall.W)}, North ${Math.round(S.wall.N)}, River ${Math.round(S.wall.R)}. Works: West ${worksText("W")}, North ${worksText("N")}, River ${worksText("R")}. ${openBreach().length?"Open breach at "+openBreach().map(nm).join(" and ")+". ":""}Food for ${fmt(S.food)} days, rations ${S.ration}. Timber ${Math.floor(S.timber)}. Oil ${S.oil}. Morale ${moraleWord(S.morale)}, ${Math.round(S.morale)} out of ten. The enemy looks like ${enemyWords()}. ${engineWords()} ${reliefWords()} Renown ${S.score}.`}
function intelText(){const l=reportList().map(r=>`${WHO[r.src].n.split(",")[0]} says ${nm(r.claim)}${r.type?", with "+TYP[r.type].name:""}${r.src==="defectors"?"":", record "+recWords(r.src)}.`);return "Intelligence. "+(l.length?l.join(" "):"No reports yet.")+" "+assessWords()+" "+(Object.keys(S.scouted||{}).length?"Scouts: "+Object.keys(S.scouted).map(s=>nm(s)+" is "+S.scouted[s].role+", with "+TYP[S.scouted[s].type].name).join("; ")+". ":"")+engineWords()}
addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key,lk=k.toLowerCase(),t=e.target,tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;
  if(cur==="title")return;
  if(k==="Escape"&&backFn){e.preventDefault();backFn();return}
  if((k==="Enter"||k===" ")&&skipFn&&tag!=="BUTTON"){e.preventDefault();skipFn();return}
  if(cur==="decide"){if(/^[0-9]$/.test(k)){e.preventDefault();const n=+k;if(n===0)ctx.fin(null);else if(ctx.opts[n-1])ctx.fin(ctx.opts[n-1])}return}
  if(lk==="t"){e.preventDefault();const on=!(Sfx.assist&&Sfx.assist());Sfx.setAssist&&Sfx.setAssist(on);sayq([{t:on?"Assist on. Timed decisions now give you twelve seconds.":"Assist off. Timed decisions give you seven seconds.",v:0}]);return}
  if(!S)return;
  if(lk==="s"){e.preventDefault();SEQ++;sayq([{t:statusText(),v:4}]);return}
  if(lk==="i"){e.preventDefault();SEQ++;sayq([{t:intelText(),v:0}]);return}
  if(lk==="r"){e.preventDefault();if(LAST.length){SEQ++;sayq(LAST)}return}
  if(lk==="h"&&(cur==="orders"||cur==="battle"||cur==="choose")){e.preventDefault();S.hints++;S.hintsUsed++;sayq([{t:"Hint. "+SG.hint(S),v:0}]);return}
  if(lk==="m"&&cur==="orders"){e.preventDefault();sayq([{t:menuSpeech(),v:0}]);return}
  if(lk==="m"&&cur==="battle"){e.preventDefault();sayq([{t:battleMenuSpeech(),v:0}]);return}
  if(lk==="l"&&cur==="night"){e.preventDefault();$("#again").click();return}
  if(lk==="l"&&cur==="battle"){e.preventDefault();$('[data-k="6"]').click();return}
  if(lk==="p"&&cur==="end"){e.preventDefault();$("#again").click();return}
  if(k==="Enter"&&tag!=="BUTTON"){const b=$("#go")||$("#done");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(/^[0-9]$/.test(k)){const b=$(`[data-k="${k}"]`);if(b){e.preventDefault();b.click()}}
});
addEventListener("pointerdown",()=>AU.init(),{once:true});

/* ===================== ACCESSIBILITY + ATMOSPHERE (shared layers) ===================== */
Access.register({
 name:"siege",
 speak:t=>sayq([{t,v:0}]),
 busy:()=>!S||cur==="title"||cur==="assault"||cur==="decide"||cur==="end"||cur==="brief",
 compass(){
  if(!S)return null;const night=["night","battle","assault","decide"].includes(cur),h=S.heard;
  const nz=s=>night&&h&&h[s]?(h[s].lvl>.7?", enemy noise loud":h[s].lvl>.4?", enemy noise steady":", enemy noise faint")+(h[s].type?", sounds like "+TYP[h[s].type].name:""):"";
  return{items:SECT.map(s=>({pan:PAN[s],label:cap1(nm(s))})),say:"On your left, "+nm("W")+": "+S.troops.W+" soldiers, wall "+Math.round(S.wall.W)+", "+worksText("W")+nz("W")+". Straight ahead, "+nm("N")+": "+S.troops.N+" soldiers, wall "+Math.round(S.wall.N)+", "+worksText("N")+nz("N")+". On your right, "+nm("R")+": "+S.troops.R+" soldiers, wall "+Math.round(S.wall.R)+", "+worksText("R")+nz("R")+". Behind you, the reserve: "+S.troops.res+" soldiers."}},
 summary(){
  if(!S||cur==="title")return "Siege of Ilesanmi. Press the Begin button to start.";
  return "Day "+S.day+". "+(cur==="orders"?S.ap+" of "+S.apMax+" orders left. ":"")+SG.total(S)+" soldiers. Food for "+fmt(S.food)+" days. Timber "+Math.floor(S.timber)+", oil "+S.oil+". Morale "+moraleWord(S.morale)+". "+(["night","battle","assault","decide"].includes(cur)?"It is night.":"It is daytime.")+" The enemy looks like "+enemyWords()+"."},
 goal(){
  if(!S||cur==="title")return "Press the Begin button, then place your soldiers.";
  return "Goal: hold Ilesanmi until the relief army arrives, "+(S.relief?"at dawn on day "+S.R:"expected between day nine and day eleven")+", or break the enemy's will, or launch the grand sortie when he is shaken. "+(cur==="orders"?"You have "+S.ap+" orders left today. Build the works the enemy's weapons demand, and find the spy.":"Answer each weapon with its counter, and keep a reserve.")},
 evidence(){
  if(!S||!S.reports)return null;
  const rows=reportList().map(r=>({h:WHO[r.src].n,t:"Says the main attack is at "+nm(r.claim)+(r.type?", with "+TYP[r.type].name:"")+". "+(r.src==="defectors"?"No record.":"Record: "+recWords(r.src)+"."),tag:"today"}));
  rows.push({h:"The spy",t:assessWords(),tag:"spy"});
  rows.push({h:"Enemy weapons",t:engineWords(),tag:"enemy"});
  if(S.scouted&&Object.keys(S.scouted).length)rows.push({h:"Scouts",t:Object.keys(S.scouted).map(s=>nm(s)+" is "+S.scouted[s].role+", with "+TYP[S.scouted[s].type].name).join("; "),tag:"today"});
  return{title:"Intelligence board",rows,say:intelText()+" Press Escape to close."}}
});

go("title");
</script>
